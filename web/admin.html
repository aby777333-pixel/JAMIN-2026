<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JAMIN Admin Console</title>
    <meta name="theme-color" content="#FD0001" />
    <link rel="icon" href="logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --red:#fd0001; --red-deep:#c70000; --gold:#fbbc15; --gold-deep:#c8911e; --ink:#1a1a1a;
        --charcoal:#202020; --muted:#74746e; --line:#e6e7e2; --paper:#f7f7f5; --surface:#fff;
        --success:#1e9e5a; --danger:#d4351c; --warn:#e6a10d; }
      * { box-sizing:border-box; }
      body { margin:0; font-family:Inter,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--paper); }
      .mono { font-family:"JetBrains Mono",monospace; }
      button { font-family:inherit; cursor:pointer; }
      input,select,textarea { font-family:inherit; }
      a { color:var(--red); }
      .hidden { display:none !important; }

      /* Login */
      .login-wrap { min-height:100vh; display:grid; place-items:center; padding:20px; }
      .card { background:var(--surface); border:1px solid var(--line); border-radius:20px; }
      .login { width:100%; max-width:400px; padding:30px; }
      .login img { height:40px; margin-bottom:18px; }
      .login h1 { font-size:22px; margin:0 0 4px; }
      .login p { color:var(--muted); margin:0 0 18px; font-size:14px; }
      label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:12px 0 6px; }
      .inp { width:100%; height:48px; border:1px solid var(--line); border-radius:12px; padding:0 14px; font-size:16px; outline:none; background:var(--paper); }
      /* Date pickers: the default 14px side padding + 16px font left no room for
         the dd-mm-yyyy text next to the calendar icon in narrow table cells —
         the value was clipped invisible. Tighter padding + a floor width fits both. */
      input.inp[type="date"], input.inp[type="datetime-local"] { padding:0 8px; font-size:14px; min-width:150px; }
      .inp:focus { border-color:var(--red); }
      textarea.inp { height:auto; padding:10px 14px; }
      .btn { border:none; border-radius:12px; padding:12px 18px; font-weight:600; font-size:15px; background:var(--red); color:#fff; }
      .btn:hover { background:var(--red-deep); }
      .btn:disabled { opacity:.5; }
      .btn-g { background:var(--gold); color:var(--ink); } .btn-g:hover{ background:var(--gold-deep); }
      .btn-o { background:rgba(251,188,21,.12); color:var(--ink); border:1px solid rgba(200,145,30,.45); }
      .btn-o:hover { background:rgba(251,188,21,.24); }
      .btn-d { background:transparent; color:var(--danger); border:1px solid var(--line); }
      .btn-sm { padding:8px 12px; font-size:13px; border-radius:10px; }
      .full { width:100%; margin-top:16px; }
      .msg { margin-top:12px; font-size:13px; font-weight:600; min-height:16px; }
      .msg.ok { color:var(--success); } .msg.err { color:var(--danger); }

      /* App shell */
      .shell { display:grid; grid-template-columns:230px 1fr; min-height:100vh; }
      .side { background:var(--charcoal); color:#fff; padding:18px 14px; }
      .side .brand { display:flex; align-items:center; gap:8px; padding:6px 8px 16px; }
      .side .brand img { height:30px; border-radius:6px; }
      .side .brand b { font-size:13px; letter-spacing:1px; }
      /* Calm sidebar (matches the app's brand-only redesign): quiet rows, one
         crimson active state, grouped under small section labels. */
      .nav-i { display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:transparent; border:none; border-left:3px solid transparent; color:rgba(255,255,255,.82); padding:9px 12px; border-radius:10px; font-size:14px; font-weight:500; margin-bottom:2px; }
      .nav-i:hover { background:rgba(255,255,255,.10); color:#fff; }
      .side > .nav-i.active { background:var(--red); color:#fff; font-weight:700; }
      .nav-i.active:hover { background:var(--red); }
      .nav-sec { font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.42); padding:14px 12px 5px; }
      .nav-i .dot { margin-left:auto; background:var(--gold); color:var(--ink); font-size:11px; font-weight:700; border-radius:999px; padding:1px 7px; }
      .who { margin-top:22px; padding:10px 12px; font-size:12px; color:rgba(255,255,255,.6); border-top:1px solid rgba(255,255,255,.12); }
      .main { padding:24px 26px; min-width:0; }
      .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:12px; }
      .head h2 { margin:0; font-size:24px; font-weight:800; letter-spacing:-.4px; }
      .head h2::after { content:''; display:block; width:44px; height:3px; border-radius:99px; margin-top:6px; background:var(--red); }
      .stat-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
      .stat { background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--sa,var(--line)); border-radius:14px; padding:14px 16px; min-width:120px; }
      .stat .n { font-family:"JetBrains Mono",monospace; font-weight:700; font-size:22px; color:var(--sa,var(--ink)); }
      .stat .l { color:var(--muted); font-size:12px; }

      table { width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
      th,td { text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle; }
      th { background:var(--paper); font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
      tr:last-child td { border-bottom:none; }
      .pill { display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; padding:3px 9px; border-radius:999px; }
      .pill.available,.pill.verified,.pill.paid { background:rgba(30,158,90,.14); color:var(--success); }
      .pill.reserved,.pill.pending,.pill.requested,.pill.approved { background:rgba(230,161,13,.16); color:var(--warn); }
      .pill.sold,.pill.rejected { background:rgba(212,53,28,.14); color:var(--danger); }
      .pill.neutral { background:rgba(26,26,26,.08); color:var(--ink); }
      .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
      .panel { background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--pa,var(--line)); border-radius:16px; padding:18px; margin-bottom:18px; }
      .panel h3 { margin:0 0 12px; font-size:16px; display:flex; align-items:center; gap:8px; }
      .panel h3::before { content:''; width:8px; height:8px; border-radius:99px; background:var(--red); flex:none; }
      .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
      .thumbs { display:flex; gap:6px; flex-wrap:wrap; }
      .thumbs img { width:40px; height:40px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
      .muted { color:var(--muted); font-size:13px; }
      select.inp { height:48px; }
      @media (max-width:760px){ .shell{ grid-template-columns:1fr; } .side{ display:flex; gap:6px; overflow-x:auto; } .nav-i{ width:auto; white-space:nowrap; } .nav-sec{ display:none; } .who{ display:none; } .grid2{ grid-template-columns:1fr; } }

      /* ── Calm skin (matches the app's simplification redesign): brand colors
         only, flat surfaces, no gradients/glow/motion. Visual layer only. */
      .login { box-shadow:0 12px 32px rgba(32,32,32,.10); }
      .panel { box-shadow:0 2px 8px rgba(32,32,32,.04); }
      table { box-shadow:0 2px 8px rgba(32,32,32,.04); }
      /* Breathing room between sections. */
      .panel { margin-bottom:22px; }
      table { margin:16px 0 22px; }
      .stat-row { gap:14px; margin-bottom:22px; }
      /* Table readability: zebra rows + bolder first column + quiet hover. */
      tbody tr:nth-child(even) td { background:rgba(32,32,32,.018); }
      tbody tr:hover td { background:rgba(32,32,32,.035); }
      td:first-child { font-weight:600; }
      ::selection { background:rgba(251,188,21,.35); }
      ::-webkit-scrollbar { width:10px; height:10px; }
      ::-webkit-scrollbar-track { background:transparent; }
      ::-webkit-scrollbar-thumb { background:rgba(32,32,32,.25); border-radius:99px; border:2px solid var(--paper); }

      /* ── Dark mode (toggle in the sidebar; preference persisted) ── */
      body.dark { --paper:#131316; --surface:#1d1d21; --ink:#ECECEA; --muted:#A4A49D; --line:#2E2E33; color:var(--ink); }
      body.dark .main { background:var(--paper); }
      body.dark .login-wrap { background:var(--paper); }
      body.dark .login { background:var(--surface); }
      body.dark .panel { background:var(--surface); }
      body.dark .inp { background:#232328; color:var(--ink); }
      /* Date/datetime internals (dd-mm-yyyy segments, calendar icon, popup) are
         drawn by the browser with UA colours keyed to the page's color-scheme —
         light by default, so on the dark input background the value/placeholder
         text was invisible. Declare the control dark and pin the text ink. */
      body.dark input.inp[type="date"], body.dark input.inp[type="datetime-local"] { color-scheme: dark; }
      body.dark input.inp[type="date"]::-webkit-datetime-edit, body.dark input.inp[type="datetime-local"]::-webkit-datetime-edit { color: var(--ink); }
      body.dark .btn-o { background:rgba(251,188,21,.16); color:var(--ink); }
      body.dark tbody tr:nth-child(even) td { background:rgba(255,255,255,.025); }
      body.dark tbody tr:hover td { background:rgba(251,188,21,.10); }
      /* Elements that hardcode a LIGHT inline background (explainer panels,
         chat bubbles, lead drawers) keep dark text in dark mode — otherwise
         the inherited light ink vanishes on them. Inline colours still win. */
      body.dark [style*="background:#f"] { color:#1a1a1a; }
      body.dark [style*="background:#f"] .muted { color:#74746E; }
      /* Outline buttons inside those light containers must ALSO keep dark ink —
         body.dark .btn-o otherwise paints light ink on the light inline bg. */
      body.dark [style*="background:#f"] .btn-o { color:#1a1a1a; }
      #themeToggle { margin-top:12px; background:rgba(255,255,255,.10); border-left-color:transparent; }

      /* ── Activity radar: blinking tab + bulb + toast pop-ups ── */
      @keyframes actGlow { 0%,100% { filter:brightness(1); } 50% { filter:brightness(1.85); } }
      @keyframes bulbBlink { 0%,100% { opacity:1; } 50% { opacity:.2; } }
      .nav-i.activity { animation: actGlow 1s ease-in-out infinite; }
      .nav-i.activity::after {
        content:''; flex:none; margin-left:auto; width:9px; height:9px; border-radius:99px;
        background:#FFD23F; box-shadow:0 0 10px 3px rgba(255,210,63,.85);
        animation: bulbBlink 1s ease-in-out infinite;
      }
      #actToasts { position:fixed; right:18px; bottom:18px; z-index:9999; display:flex; flex-direction:column; gap:10px; }
      .actToast {
        display:flex; align-items:center; gap:10px; background:#202020; color:#fff;
        border-radius:14px; padding:12px 16px; box-shadow:0 10px 30px rgba(0,0,0,.35);
        cursor:pointer; max-width:320px; animation: toastIn .25s ease;
      }
      .actToast small { color:rgba(255,255,255,.65); }
      .actToast .bulb { flex:none; width:10px; height:10px; border-radius:99px; background:#FFD23F; box-shadow:0 0 10px 3px rgba(255,210,63,.8); animation: bulbBlink 1s infinite; }
      .actToast.out { opacity:0; transition:opacity .4s; }
      @keyframes toastIn { from { transform:translateY(8px); opacity:0; } to { transform:none; opacity:1; } }
    </style>
  </head>

      $('sendBtn').onclick = async function () {
        var email = $('email').value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setLoginMsg('Enter a valid email.', false); return; }
        this.disabled = true; setLoginMsg('Sending…', true);
        var r = await sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: false } });
        this.disabled = false;
        if (r.error) { setLoginMsg(r.error.message, false); return; }
        $('emailEcho').textContent = email; $('step1').classList.add('hidden'); $('step2').classList.remove('hidden');
        setLoginMsg('Code sent. Check your email.', true);
      };
      $('backBtn').onclick = function () { $('step2').classList.add('hidden'); $('step1').classList.remove('hidden'); setLoginMsg(''); };
      $('verifyBtn').onclick = async function () {
        var email = $('email').value.trim(), token = $('code').value.trim();
        if (!/^\d{6}$/.test(token)) { setLoginMsg('Enter the 6-digit code.', false); return; }
        this.disabled = true; setLoginMsg('Verifying…', true);
        var r = await sb.auth.verifyOtp({ email: email, token: token, type: 'email' });
        this.disabled = false;
        if (r.error) { setLoginMsg(r.error.message, false); return; }
        await boot();
      };
      $('signOut').onclick = async function () { await sb.auth.signOut(); location.reload(); };

      async function boot() {
        var s = await sb.auth.getSession();
        if (!s.data.session) { show('login'); return; }
        state.user = s.data.session.user;
        var prof = await sb.from('profiles').select('email, role:roles(is_admin)').eq('id', state.user.id).maybeSingle();
        var isAdmin = prof.data && prof.data.role && prof.data.role.is_admin === true;
        if (!isAdmin) { setLoginMsg('This account is not an administrator.', false); await sb.auth.signOut(); show('login'); return; }
        $('whoEmail').textContent = prof.data.email || state.user.email;
        show('app');
        await loadLookups();
        switchTab('dashboard');
        refreshApprovalsBadge();
        refreshSubmissionsBadge();
        refreshFormSubsBadge();

      function opt(arr, val, labelFn) { return arr.map(function (x) { return '<option value="' + x.id + '"' + (x.id === val ? ' selected' : '') + '>' + labelFn(x) + '</option>'; }).join(''); }
      function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]); }); }
      function inr(n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); }
      /** AI outputs sometimes contain HTML (email drafts) — show them as readable
          text: <br>/<p> become line breaks, other tags drop, entities decode. */
      function stripHtml(s) {
        return String(s == null ? '' : s)
          .replace(/<br\s*\/?>/gi, '\n')
          .replace(/<\/p>\s*/gi, '\n\n')
          .replace(/<[^>]+>/g, '')
          .replace(/&nbsp;/g, ' ')
          .replace(/&amp;/g, '&')
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
          .replace(/&quot;/g, '"')
          .replace(/\n{3,}/g, '\n\n')
          .trim();

        var leads = res[0].data || [], pays = res[1].data || [], props = res[2].data || [];

        // ── derived business metrics ──
        var SLA_D = 24 * 3600 * 1000;

        var isStaleL = function (l) { return l.status === 'new' && l.last_touch_at && (Date.now() - new Date(l.last_touch_at).getTime()) > SLA_D; };

        // leads that need action NOW: hot band in an open stage, or stale

        // most viewed properties (7 days)
        var byPlot = {};
        views7.forEach(function (v) { var pc = v.property && v.property.plot_code; if (pc) byPlot[pc] = (byPlot[pc] || 0) + 1; });
        var topViewed = Object.keys(byPlot).sort(function (a, b) { return byPlot[b] - byPlot[a]; }).slice(0, 6);
        var pendingApprovals = props.filter(function (p) { return p.approval_status === 'pending'; }).length;
        // one consolidated to-do list — each row jumps to its tab
        var needs = [
          { n: pendingApprovals, label: 'Listing approvals waiting', tab: 'approvals' },
          { n: nProofs, label: 'Payment proofs to verify', tab: 'payments' },
          { n: nStaff, label: 'Staff applications to review', tab: 'staff' },
          { n: nPhotoSubs, label: 'Photo submissions to review', tab: 'submissions' },
          { n: nDisputes, label: 'Open disputes', tab: 'moderation' },
          { n: staleN, label: 'Stale leads — untouched 24h+', tab: 'crm' },
        ].filter(function (x) { return x.n > 0; });

        function tile(n, label, hot) {
          return '<div class="stat"><div class="n"' + (hot ? ' style="color:#e6a10d"' : '') + '>' + n + '</div><div class="l">' + label + '</div></div>';

        function chartPanel(id, title) {

        }
        function listPanel(title, inner) {

        var rowStyle = 'display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed rgba(128,128,128,.25)';

              '<span style="font-size:12px;flex:1">' + esc(c.name || '—') + '</span>' +
              '<span class="muted" style="font-size:11px">' + esc(f.note || '') + '</span></div>';
          }).join('') : '') +
          (!visitsToday.length && !fuDue.length ? '<div class="muted" style="font-size:12px;padding:12px 0">Nothing scheduled today.</div>' : '');

        var actHtml = actLeads.length
          ? actLeads.map(function (l) {

              return '<button type="button" class="btn-o btn-sm dash_go" data-tab="crm" style="display:flex;width:100%;justify-content:space-between;align-items:center;margin-bottom:5px;text-align:left">' +

                '<span class="pill ' + (l.score_band === 'hot' ? 'available' : 'sold') + '" style="font-size:10px">' + (l.score_band === 'hot' ? '🔥 hot' : '⏰ stale') + '</span></button>';

          labels: funnel,
          datasets: [{ data: funnel.map(function (s) { return byStat[s] || 0; }), backgroundColor: ['#3E63DD', '#F76B15', '#D9A514', '#12A594', '#30A46C', '#E5484D'] }] },
          options: Object.assign({}, noLegend, { indexAxis: 'y', scales: { x: { ticks: tick, grid: grid, beginAtZero: true }, y: { ticks: tick, grid: { display: false } } } }) }));

        // 5) collected by month (last 6)
        var months = [], mSum = {};
        for (var m = 5; m >= 0; m--) {
          var dt = new Date(); dt.setMonth(dt.getMonth() - m);
          var key = dt.toISOString().slice(0, 7);
          months.push(key); mSum[key] = 0;
        }
        pays.forEach(function (p) {

        ((pq.data) || []).forEach(function (p) { if (p.territory_id) memberCount[p.territory_id] = (memberCount[p.territory_id] || 0) + 1; });

        // Build the hierarchy: children per parent + depth-first order for the tree view.
        var byParent = {};
        terr.forEach(function (t) { var k = t.parent_id || ''; (byParent[k] = byParent[k] || []).push(t); });
        var ordered = [];
        (function walk(pid, depth) {
          (byParent[pid] || []).forEach(function (t) { ordered.push({ t: t, depth: depth }); walk(t.id, depth + 1); });
        })('', 0);
        // Orphans whose parent row was deleted still need to show up.
        var seen = {}; ordered.forEach(function (o) { seen[o.t.id] = true; });
        terr.forEach(function (t) { if (!seen[t.id]) ordered.push({ t: t, depth: 0 }); });

        /** ids of `id` + all its descendants — invalid as a new parent (would loop). */
        function subtreeIds(id) {
          var out = { }; out[id] = true;
          (function walk2(pid) { (byParent[pid] || []).forEach(function (c) { out[c.id] = true; walk2(c.id); }); })(id);
          return out;
        }

        var explain =
          '<div class="panel" style="background:#f2f9f4;border-color:#bfe3cb"><h3>What territories do</h3>' +

            '</select>' +
            '<button id="tr_add" class="btn btn-sm">Add</button></div></div>' +
          (ordered.length ? '<table><thead><tr><th>Territory</th><th>Parent</th><th>Members</th><th>Created</th><th></th></tr></thead><tbody>' +
          ordered.map(function (o) {
            var t = o.t;
            var invalid = subtreeIds(t.id);

              .filter(function (x) { return !invalid[x.t.id]; })
              .map(function (x) { return '<option value="' + x.t.id + '"' + (x.t.id === t.parent_id ? ' selected' : '') + '>' + '  '.repeat(x.depth) + esc(x.t.name) + '</option>'; }).join('');
            return '<tr data-id="' + t.id + '">' +
              '<td><span style="display:inline-block;width:' + (o.depth * 18) + 'px"></span>' + (o.depth ? '↳ ' : '') +
                '<input class="inp tr_name2" style="width:180px;height:36px" value="' + esc(t.name) + '" /></td>' +
              '<td><select class="inp tr_parent2" style="height:36px;max-width:220px">' + parentOpts + '</select></td>' +
              '<td>' + (memberCount[t.id] || 0) + '</td>' +
              '<td class="muted">' + (t.created_at ? new Date(t.created_at).toLocaleDateString('en-IN') : '—') + '</td>' +
              '<td><button class="btn btn-sm tr_save">Save</button> <button class="btn btn-sm tr_del" style="background:#fee;color:#c00">Del</button></td></tr>';
          }).join('') + '</tbody></table>'
          : '<div class="muted">No territories yet — add one above. Assign members to territories in Users &amp; roles.</div>');

        $('tr_add').onclick = async function () {
          var name = $('tr_name').value.trim(); if (!name) return;

          tr.querySelector('.tr_del').onclick = async function () {
            var kids = (byParent[id] || []).length;
            var members = memberCount[id] || 0;

            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, function (p) {

      async function loadThreads() {
        var tl = $('threadList'); if (!tl) return;
        var q = await sb.from('chat_threads')
          .select('id,status,last_message_at, buyer:profiles!buyer_id(full_name)')

      async function loadMessages(tid) {
        var mp = $('msgPane'); if (!mp) return;
        var th = await sb.from('chat_threads').select('status, buyer:profiles!buyer_id(full_name)').eq('id', tid).maybeSingle();
        var tStatus = (th.data && th.data.status) || 'open';
        var tName = (th.data && th.data.buyer && th.data.buyer.full_name) || 'Member';
        var q = await sb.from('messages').select('id,sender_id,body,created_at').eq('thread_id', tid).order('created_at');
        var rows = q.data || [];
        mp.innerHTML = '<div class="row" style="justify-content:space-between;margin-bottom:8px">' +
            '<div><b>' + esc(tName) + '</b> <span class="pill ' + (tStatus === 'resolved' ? 'paid' : 'requested') + '">' + esc(tStatus) + '</span></div>' +
            '<button id="chatResolve" class="btn-o btn-sm">' + (tStatus === 'resolved' ? 'Reopen' : 'Mark resolved') + '</button>' +
          '</div>' +
          '<div style="border:1px solid var(--line);border-radius:12px;height:440px;display:flex;flex-direction:column;overflow:hidden">' +
          '<div id="msgScroll" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px">' +
          rows.map(function (m) {
            var mine = m.sender_id === state.user.id;
            return '<div style="max-width:75%;padding:8px 12px;border-radius:12px;font-size:14px;' + (mine ? 'align-self:flex-end;background:var(--red);color:#fff' : 'align-self:flex-start;background:var(--paper);color:var(--ink)') + '">' + esc(m.body) + '</div>';
          }).join('') +
          '</div>' +
          '<div class="row" style="padding:8px;border-top:1px solid var(--line)"><input id="chatInput" class="inp" style="flex:1" placeholder="Reply…" /><button id="chatSend" class="btn btn-sm">Send</button></div></div>';
        var sc = $('msgScroll'); if (sc) sc.scrollTop = sc.scrollHeight;
        $('chatSend').onclick = sendChat;
        $('chatInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendChat(); });
        $('chatResolve').onclick = async function () {
          var ns = tStatus === 'resolved' ? 'open' : 'resolved';
          this.disabled = true;
          var r = await sb.from('chat_threads').update({ status: ns }).eq('id', tid);
          this.disabled = false;
          if (r.error) { alert(r.error.message); return; }
          loadThreads(); loadMessages(tid);
        };
      }
      async function sendChat() {
        var inp = $('chatInput'); var body = (inp.value || '').trim(); if (!body || !chatThread) return;

        var r = await sb.from('messages').insert({ thread_id: chatThread, sender_id: state.user.id, body: body });
        if (r.error) { alert(r.error.message); return; }
        loadMessages(chatThread);

              '<div class="le_editor hidden" style="margin-top:6px">' +
                '<input class="inp le_t" style="width:100%;height:34px;margin-bottom:6px" value="' + esc(l.title) + '" />' +

          var quizHtml = quiz.length ? quiz.map(function (qq2, i) {

              '<div style="font-size:12px;margin-top:4px">' + (qq2.options || []).map(function (o, oi) {
                return '<span class="pill" style="margin-right:5px;' + (oi === qq2.correct_index ? 'background:rgba(48,164,108,.25);color:#30a46c;font-weight:700' : '') + '">' + (oi === qq2.correct_index ? '✓ ' : '') + esc(o) + '</span>';
              }).join('') + '</div></div>';
          }).join('') : '<div class="muted" style="font-size:12px;margin-bottom:8px">No quiz questions yet.</div>';

          var detail = document.createElement('tr');
          detail.className = 'ac_detail';
          detail.innerHTML = '<td colspan="6" style="background:#fafaf8;padding:14px 18px">' +
            '<div class="row" style="align-items:center;gap:8px;margin-bottom:10px"><b style="font-size:14px">📖 ' + esc(course.title) + '</b>' +

              '<button class="btn-o btn-sm ac_pass_save">Save %</button></div>' +
            '<b style="font-size:12px">Lessons</b><div style="margin:6px 0 10px">' + lessonsHtml + '</div>' +

              '<b style="font-size:12px">+ Add lesson</b>' +
              '<input class="inp nl_t" style="width:100%;height:34px;margin:6px 0" placeholder="Lesson title" />' +
              '<textarea class="inp nl_c" style="width:100%;min-height:100px;height:auto;padding:10px" placeholder="Lesson content — write freely, line breaks are kept"></textarea>' +
              '<div class="row" style="margin-top:6px;gap:6px"><input class="inp nl_v" style="flex:1;height:34px" placeholder="Video URL (optional)" />' +
              '<button class="btn btn-sm nl_add">Add lesson</button></div></div>' +
            '<b style="font-size:12px">Quiz questions</b><div style="margin:6px 0 8px">' + quizHtml + '</div>' +
            '<div style="border:1px dashed rgba(128,128,128,.4);border-radius:10px;padding:10px 12px">' +
              '<b style="font-size:12px">+ Add question</b>' +
              '<input class="inp nq_q" style="width:100%;height:34px;margin:6px 0" placeholder="Question" />' +

              '<input class="inp nq_c" type="number" min="1" style="width:130px;height:34px" placeholder="Correct # (1…)" />' +
              '<button class="btn btn-sm nq_add">Add question</button></div></div></td>';
          tr.parentNode.insertBefore(detail, tr.nextSibling);

          detail.querySelector('.ac_pass_save').onclick = async function () {

            if (r.error) return alert(r.error.message);

            var lid = box.dataset.lid;

              box.querySelector('.le_editor').classList.remove('hidden');

              box.querySelector('.le_editor').classList.add('hidden');

              var r = await sb.from('academy_lessons').update({
                title: box.querySelector('.le_t').value.trim(),
                content: box.querySelector('.le_c').value.trim() || null,
                video_url: box.querySelector('.le_v').value.trim() || null,
              }).eq('id', lid);
              if (r.error) return alert(r.error.message);
              reload();
            };
            box.querySelector('.le_del').onclick = async function () {
              if (!confirm('Delete this lesson?')) return;
              var r = await sb.from('academy_lessons').delete().eq('id', lid);
              if (r.error) return alert(r.error.message);
              reload(); renderAcademy();
            };
            async function move(dir) {
              var j = idx + dir;
              if (j < 0 || j >= lessons.length) return;
              var order = lessons.slice();
              var tmp = order[idx]; order[idx] = order[j]; order[j] = tmp;
              for (var k = 0; k < order.length; k++) {
                var r2 = await sb.from('academy_lessons').update({ sort_order: (k + 1) * 10 }).eq('id', order[k].id);
                if (r2.error) return alert(r2.error.message);
              }
              reload();
            }
            box.querySelector('.le_up').onclick = function () { move(-1); };
            box.querySelector('.le_down').onclick = function () { move(1); };
          });
          detail.querySelector('.nl_add').onclick = async function () {
            var t = detail.querySelector('.nl_t').value.trim();
            if (!t) return alert('Lesson title required.');

              course_id: course.id, title: t,
              content: detail.querySelector('.nl_c').value.trim() || null,
              video_url: detail.querySelector('.nl_v').value.trim() || null,
              sort_order: (lessons.length + 1) * 10,
            });
            if (r.error) return alert(r.error.message);
            reload(); renderAcademy();
          };
          detail.querySelectorAll('[data-qid] .qz_del').forEach(function (b) {
            b.onclick = async function () {
              if (!confirm('Delete this question?')) return;
              var r = await sb.from('academy_quiz').delete().eq('id', this.closest('[data-qid]').dataset.qid);
              if (r.error) return alert(r.error.message);
              reload(); renderAcademy();
            };
          });
          detail.querySelector('.nq_add').onclick = async function () {
            var qtext = detail.querySelector('.nq_q').value.trim();
            var arr = detail.querySelector('.nq_o').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
            var ci = parseInt(detail.querySelector('.nq_c').value, 10) - 1;
            if (!qtext) return alert('Question required.');
            if (arr.length < 2) return alert('Give at least two options, comma-separated.');
            if (isNaN(ci) || ci < 0 || ci >= arr.length) return alert('Correct # must be between 1 and ' + arr.length + '.');
            var r = await sb.from('academy_quiz').insert({ course_id: course.id, question: qtext, options: arr, correct_index: ci });
            if (r.error) return alert(r.error.message);
            reload(); renderAcademy();
          };
        }

        el.querySelectorAll('tr[data-id]').forEach(function (tr) {
          var id = tr.dataset.id;
          var course = rows.find(function (c) { return c.id === id; });
          var open = function () { openCourse(tr, course); };

            if (r.error) alert(r.error.message); else renderAcademy();

      async function renderDuplicates() {

        var rows = q.data || [];
        // Group by a signature: same plot_code, OR same coords+price.
        var byCode = {}, byGeo = {};
        rows.forEach(function (p) {
          if (p.plot_code) { (byCode[p.plot_code] = byCode[p.plot_code] || []).push(p); }
          var c = p.coordinates || {};
          if (c.lat != null && c.lng != null) {

            (byGeo[k] = byGeo[k] || []).push(p);
          }
        });
        function groups(obj, labeler) {
          return Object.keys(obj).filter(function (k) { return obj[k].length > 1; }).map(function (k) {
            return '<div class="panel"><h3>' + labeler(k) + ' — ' + obj[k].length + ' listings</h3>' +

              '</tbody></table></div>';
          });
        }

      // ─── Insights / BI (KPIs, demand, supply vs demand, conversion) ─────
      function statBox(n, l) { return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + esc(l) + '</div></div>'; }
      async function renderInsights() {
        var el = $('tabInsights');
        el.innerHTML = '<div class="head"><h2>Insights</h2></div><div class="muted">Crunching the numbers…</div>';
        var res = await Promise.all([
          sb.from('properties').select('status,approval_status,price, project:projects(name,location)'),
          sb.from('leads').select('id'),
          sb.from('bookings').select('id,status'),
          sb.from('offers').select('id,status'),
          sb.from('buyer_requirements').select('id,location'),
          sb.from('profiles').select('id', { count: 'exact', head: true }),
        ]);
        var props = res[0].data || [], leads = res[1].data || [], bookings = res[2].data || [];
        var offers = res[3].data || [], reqs = res[4].data || [], usersN = res[5].count || 0;

        var avail = props.filter(function (p) { return p.status === 'available'; }).length;
        var sold = props.filter(function (p) { return p.status === 'sold'; }).length;
        var soldValue = props.filter(function (p) { return p.status === 'sold'; }).reduce(function (s, p) { return s + Number(p.price || 0); }, 0);
        var pending = props.filter(function (p) { return p.approval_status === 'pending'; }).length;
        var acceptedOffers = offers.filter(function (o) { return o.status === 'accepted'; }).length;

        // Demand by area (buyer requirements) + supply by area (available listings).
        function norm(s) { return (s || '').trim(); }
        var demand = {}, supply = {};
        reqs.forEach(function (r) { var k = norm(r.location) || '(any)'; demand[k] = (demand[k] || 0) + 1; });
        props.forEach(function (p) { if (p.status === 'available') { var k = norm(p.project && p.project.location) || '(unspecified)'; supply[k] = (supply[k] || 0) + 1; } });
        var areas = Object.keys(demand).concat(Object.keys(supply)).filter(function (v, i, a) { return a.indexOf(v) === i && v !== '(any)'; });
        areas.sort(function (a, b) { return (demand[b] || 0) - (demand[a] || 0) || (supply[b] || 0) - (supply[a] || 0); });

        // Price trends — avg price by project.
        var byProj = {};
        props.forEach(function (p) { var n = (p.project && p.project.name) || '—'; (byProj[n] = byProj[n] || []).push(Number(p.price || 0)); });
        var projRows = Object.keys(byProj).map(function (n) { var a = byProj[n]; var avg = a.reduce(function (s, x) { return s + x; }, 0) / a.length; return { name: n, avg: avg, count: a.length }; }).sort(function (a, b) { return b.avg - a.avg; });

        // Conversion funnel: enquiries → bookings → sold.
        function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }

        el.innerHTML = '<div class="head"><h2>Insights &amp; business intelligence</h2></div>' +
          '<div class="stat-row">' +
            statBox(usersN, 'Users') + statBox(props.length, 'Listings') + statBox(avail, 'Available') +
            statBox(sold, 'Sold') + statBox(inr(soldValue), 'Sold value') + statBox(leads.length, 'Leads') +
            statBox(offers.length, 'Offers') + statBox(pending, 'Pending approval') +
          '</div>' +
          '<div class="panel"><h3>Conversion funnel</h3>' +
            '<div class="stat-row" style="margin:0">' +
              statBox(leads.length, 'Enquiries') +
              statBox(bookings.length, 'Bookings (' + pct(bookings.length, leads.length) + '% of enquiries)') +
              statBox(acceptedOffers, 'Accepted offers') +
              statBox(sold, 'Sold (' + pct(sold, leads.length) + '% of enquiries)') +
            '</div></div>' +
          '<div class="panel"><h3>Demand vs supply by area</h3>' +
            '<div class="muted" style="font-size:12px;margin-bottom:8px">Buyer requirements (demand) against available listings (supply), highest demand first.</div>' +
            (areas.length ? '<table><thead><tr><th>Area</th><th>Demand</th><th>Supply</th><th>Gap</th></tr></thead><tbody>' +
              areas.slice(0, 15).map(function (k) {
                var d = demand[k] || 0, s = supply[k] || 0, gap = d - s;
                return '<tr><td>' + esc(k) + '</td><td class="mono">' + d + '</td><td class="mono">' + s + '</td><td class="mono"' + (gap > 0 ? ' style="color:#e6a10d"' : '') + '>' + (gap > 0 ? '+' + gap + ' under-supplied' : gap < 0 ? gap : '0') + '</td></tr>';
              }).join('') + '</tbody></table>' : '<div class="muted">No demand data yet — buyers haven\'t saved requirements.</div>') +
          '</div>' +
          '<div class="panel"><h3>Average price by project</h3>' +
            (projRows.length ? '<table><thead><tr><th>Project</th><th>Listings</th><th>Avg price</th></tr></thead><tbody>' +
              projRows.slice(0, 15).map(function (r) { return '<tr><td>' + esc(r.name) + '</td><td class="mono">' + r.count + '</td><td class="mono">' + inr(Math.round(r.avg)) + '</td></tr>'; }).join('') + '</tbody></table>' : '<div class="muted">No listings yet.</div>') +
          '</div>' +
          '<div class="panel" id="seasonPanel"><h3>This month — top earners</h3><div class="muted">Loading…</div></div>';

        // Seasonal leaderboard (this calendar month) via the season_leaderboard RPC.
        (function () {
          var now = new Date();
          var from = new Date(now.getFullYear(), now.getMonth(), 1).toISOString();
          var to = new Date(now.getFullYear(), now.getMonth() + 1, 1).toISOString();
          sb.rpc('season_leaderboard', { p_from: from, p_to: to }).then(function (r) {
            var panel = $('seasonPanel'); if (!panel) return;
            if (r.error) { panel.innerHTML = '<h3>This month — top earners</h3><div class="muted">' + esc(r.error.message) + '</div>'; return; }
            var rows = r.data || [];
            panel.innerHTML = '<h3>This month — top earners</h3>' +
              (rows.length ? '<table><thead><tr><th>#</th><th>Member</th><th>Role</th><th>Earnings</th></tr></thead><tbody>' +
                rows.slice(0, 15).map(function (x) { return '<tr><td class="mono">' + x.rank + '</td><td>' + esc(x.full_name || 'Member') + '</td><td>' + esc(x.role_name || '') + '</td><td class="mono">' + inr(x.earnings) + '</td></tr>'; }).join('') + '</tbody></table>'
                : '<div class="muted">No commission credited this month yet.</div>');
          });
        })();
      }

      function dlBlob(filename, blob) { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
      function csvCell(v) { v = (v == null ? '' : String(v)); if (/[",\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"'; return v; }
      function logExport(name, fmt, n) { try { sb.rpc('log_admin_action', { p_action: 'export.' + fmt, p_entity: 'report', p_entity_id: null, p_payload: { report: name, rows: n } }); } catch (e) {} }
      function exportCSV(name, cols, rows) {
        var head = cols.map(function (c) { return csvCell(c.label); }).join(',');
        var body = rows.map(function (r) { return cols.map(function (c) { return csvCell(c.get(r)); }).join(','); }).join('\n');
        dlBlob(name + '.csv', new Blob(['﻿' + head + '\n' + body], { type: 'text/csv;charset=utf-8;' }));
        logExport(name, 'csv', rows.length);
      }
      function exportXLSX(name, cols, rows) {
        if (!window.XLSX) { alert('Spreadsheet library still loading — try again in a moment.'); return; }
        var aoa = [cols.map(function (c) { return c.label; })].concat(rows.map(function (r) { return cols.map(function (c) { var v = c.get(r); return v == null ? '' : v; }); }));
        var ws = XLSX.utils.aoa_to_sheet(aoa), wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, (name.replace(/[^a-zA-Z0-9 ]/g, ' ').slice(0, 28) || 'Sheet1'));
        XLSX.writeFile(wb, name + '.xlsx'); logExport(name, 'xlsx', rows.length);
      }
      function exportPDF(name, cols, rows) {
        var J = window.jspdf && window.jspdf.jsPDF; if (!J) { alert('PDF library still loading — try again in a moment.'); return; }
        var doc = new J({ orientation: 'landscape' });
        doc.setFontSize(13); doc.text(name, 14, 14);
        doc.setFontSize(9); doc.text(new Date().toLocaleString() + '  ·  ' + rows.length + ' rows', 14, 20);
        doc.autoTable({ head: [cols.map(function (c) { return c.label; })], body: rows.map(function (r) { return cols.map(function (c) { var v = c.get(r); return v == null ? '' : String(v); }); }), startY: 24, styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak' }, headStyles: { fillColor: [253, 0, 1] } });
        doc.save(name + '.pdf'); logExport(name, 'pdf', rows.length);

      /* ── Visual extras: dark-mode toggle ─────────────────────────────────────
         Self-contained and read-only towards the app logic: no shared state,
         no data writes — safe to remove wholesale. */
      (function () {
        // Dark mode — persisted, button injected into the sidebar.
        var KEY = 'jamin_admin_theme';
        function applyTheme(mode) {
          document.body.classList.toggle('dark', mode === 'dark');
          var b = document.getElementById('themeToggle');
          if (b) b.textContent = mode === 'dark' ? '☀️ Light mode' : '🌙 Dark mode';
        }
        function mountToggle() {
          var side = document.querySelector('.side');
          if (!side || document.getElementById('themeToggle')) return;
          var b = document.createElement('button');
          b.id = 'themeToggle';
          b.className = 'nav-i';
          b.type = 'button';
          b.onclick = function () {
            var next = document.body.classList.contains('dark') ? 'light' : 'dark';
            try { localStorage.setItem(KEY, next); } catch (e) { /* private mode */ }
            applyTheme(next);
          };
          var who = side.querySelector('.who');
          side.insertBefore(b, who || null);
          var saved = 'light';
          try { saved = localStorage.getItem(KEY) || 'light'; } catch (e) { /* private mode */ }
          applyTheme(saved);
        }

        // (Count-up number animation removed in the calm redesign — stats render
        // their final values immediately.)
        mountToggle();
      })();

        var lastToast = {};

        function activeTab() {
          var a = document.querySelector('.nav-i.active');

        }

        function toast(label, tab, tabName, refresh) {
          var wrap = document.getElementById('actToasts');
          if (!wrap) { wrap = document.createElement('div'); wrap.id = 'actToasts'; document.body.appendChild(wrap); }
          var el = document.createElement('div');
          el.className = 'actToast';
          var bulb = document.createElement('span'); bulb.className = 'bulb';
          var txt = document.createElement('div');
          var b = document.createElement('b'); b.textContent = label;
          var s = document.createElement('small'); s.textContent = (refresh ? 'Click to refresh ' : 'Open ') + tabName;
          txt.appendChild(b); txt.appendChild(document.createElement('br')); txt.appendChild(s);
          el.appendChild(bulb); el.appendChild(txt);
          el.onclick = function () {
            var btn = document.querySelector('.nav-i[data-tab="' + tab + '"]');
            if (btn) { btn.classList.remove('activity'); btn.click(); }
            el.remove();
          };
          wrap.appendChild(el);
          setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 450); }, 6500);
        }

        function ping(table) {
          var m = ACT[table]; if (!m) return;
          var tab = m[0], label = m[1];
          // The Dashboard light blinks on ANY activity anywhere (its own view clears it).
          var dash = document.querySelector('.nav-i[data-tab="dashboard"]');
          if (dash && activeTab() !== 'dashboard') dash.classList.add('activity');
          var btn = document.querySelector('.nav-i[data-tab="' + tab + '"]');
          var onIt = activeTab() === tab;
          if (!onIt && btn) btn.classList.add('activity');
          var now = Date.now();
          if (lastToast[tab] && now - lastToast[tab] < 8000) return; // coalesce bursts
          lastToast[tab] = now;
          // Already viewing the tab? Its content is a snapshot — offer a
          // one-click refresh instead of staying silent (clicking the toast
          // re-runs switchTab, which re-renders the open tab).
          toast(label, tab, btn ? btn.textContent.trim() : tab, onIt);
          try {
            if (window.Notification && Notification.permission === 'granted') {
              new Notification('JAMIN Admin', { body: label });
            }
          } catch (e) { /* ignore */ }
        }
        window.__actPing = ping; // manual test hook

        var radarChannel = null;
        function start() {
          var ch = sb.channel('admin-activity-' + Date.now());
          Object.keys(ACT).forEach(function (t) {
            ch.on('postgres_changes', { event: 'INSERT', schema: 'public', table: t }, function () { ping(t); });
          });
          // One unknown table fails the whole channel — surface it loudly.
          ch.subscribe(function (status, err) {
            console.log('[activity-radar]', status, err ? String(err) : '');
          });
          radarChannel = ch;
        }
        function restart() {
          try { if (radarChannel) sb.removeChannel(radarChannel); } catch (e) { /* ignore */ }
          radarChannel = null;
          start();
        }
        // Watchdog: long-open tabs lose the realtime channel silently (token
        // expiry / network blips) and the radar goes dark — resubscribe when
        // the channel is no longer joined, and whenever the tab regains focus.
        setInterval(function () {
          if (radarChannel && radarChannel.state !== 'joined' && radarChannel.state !== 'joining') restart();
        }, 60000);
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden && radarChannel && radarChannel.state !== 'joined' && radarChannel.state !== 'joining') restart();
        });

        // Opening a tab clears its blink (attach immediately — tabs exist pre-login).
        document.querySelectorAll('.side > .nav-i').forEach(function (btn) {
          btn.addEventListener('click', function () { btn.classList.remove('activity'); });
        });

        (function boot() {
          var app = document.getElementById('appView');
          if (typeof sb === 'undefined' || !sb || !app || app.classList.contains('hidden')) {
            return setTimeout(boot, 900); // wait for login
          }
          start();
        })();
      })();
    </script>
  </body>
</html>
